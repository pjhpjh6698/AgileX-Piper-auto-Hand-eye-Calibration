# ArUco target detector parameters.
# Loaded by aruco_detector_node. All lengths in meters.
#
# The topics below are namespaced to the wrist (eye-in-hand) camera:
# real_calibration.launch.py starts it with camera_namespace:=wrist
# camera_name:=camera. The namespace is fixed even on a single-camera rig, so
# that adding a second camera later needs no config change here -- pin the
# wrist one with wrist_camera_serial:= and nothing depends on USB order.
/**:
  ros__parameters:
    image_topic: /wrist/camera/color/image_raw
    camera_info_topic: /wrist/camera/color/camera_info

    # Calibration target. target_type picks between:
    #   aruco   -- a single ArUco marker (default)
    #   charuco -- a ChArUco board: chessboard corners interpolated from the
    #              ArUco markers printed in its white squares. Many corners
    #              instead of 4, so the pose is considerably more stable.
    # Switchable at runtime from the GUI (or `ros2 param set`).
    target_type: aruco
    aruco_dictionary: DICT_4X4_50     # see cv2.aruco.DICT_* names
    target_marker_id: 1               # only this ID is used as the target
    marker_length: 0.07               # marker side length [m]

    # ---- charuco board geometry (only used when target_type: charuco) ----
    # The calib.io spec for this rig: 11 x 8 squares at 15 mm, DICT_4X4,
    # Start ID 1 -- so the printed pattern must span 165 x 120 mm.
    #
    # VERIFY THAT SPAN WITH A RULER BEFORE TRUSTING A CALIBRATION. The first
    # print of this board came out at 133.3% (72-vs-96 DPI, the classic PDF
    # scaling slip), making the squares 20 mm while this file still said 15.
    # square_length is the board's only scale, so every board pose came back
    # 25% too close; and because the sweep aims all poses at one point, that
    # depth bias did not average out. It landed in gripper_T_camera as a ~4 cm
    # shift along the optical axis with the rotation still exact -- which is
    # exactly why ChArUco matched ArUco in orientation but not in position, and
    # why nothing downstream flagged it. Print at 100% / "actual size", then
    # measure the full 11-square and 8-square spans and divide; the two must
    # agree. Correct this value to whatever they say.
    charuco_squares_x: 11             # calib.io "Columns"
    charuco_squares_y: 8              # calib.io "Rows"
    charuco_square_length: 0.015      # calib.io "Checker Width" -> 165 x 120 mm
    # calib.io's generator has no marker-size field; 0.0112 assumes the usual
    # 0.75 ratio. Only affects which corners get interpolated, not the pose
    # scale, so an approximate value here is harmless.
    charuco_marker_length: 0.0112
    # calib.io "Start ID". OpenCV numbers board markers from 0; with the wrong
    # start every marker maps to the wrong cell and the board barely detects.
    charuco_start_id: 1
    charuco_min_corners: 6            # fewer interpolated corners => rejected

    # Frames
    camera_frame: camera_color_optical_frame
    target_frame: calibration_target

    # Output
    publish_debug_image: true
    publish_tf: false                 # detector->target TF (debug only; not the handeye TF)

    # ---- Detection-rate tuning ------------------------------------------
    # CLAHE (adaptive histogram equalisation) before detection: evens out
    # glare and washed-out lighting -- phone screens and overhead lights are
    # where most "marker clearly visible yet not detected" frames come from.
    enable_clahe: true
    # OpenCV's default adaptive-threshold sweep (3..23 px windows) is sized
    # for SMALL markers; a marker filling much of a 720p frame fragments under
    # those windows and no quad is ever formed. Sweep bigger windows too.
    adaptive_thresh_win_max: 45
    adaptive_thresh_win_step: 6
    # Correct one more bit-error than the 0.6 default -- cheap robustness
    # against glare speckle. Do not raise past ~0.9 (false positives).
    error_correction_rate: 0.8

    # Planar pose-flip ambiguity gate. A square marker seen near-frontally has
    # TWO PnP solutions with almost equal reprojection error; letting the
    # winner flip frame-to-frame corrupts camera_T_target by tens of degrees
    # and makes every hand-eye method "agree" on a garbage result (~15 deg
    # rotation RMS). Below this best/second error ratio the frame is
    # disambiguated against the previous pose or rejected as pose_ambiguous.
    ambiguity_min_ratio: 1.3

    # Quality gates (a detection failing any of these is rejected)
    maximum_reprojection_error: 3.0   # pixels
    minimum_marker_area: 400.0        # px^2, reject markers that are too small/far
    border_margin_px: 5.0             # reject markers whose corners hug the image border

    # Sub-pixel corner refinement. Leave this on: OpenCV's default is
    # CORNER_REFINE_NONE, which snaps marker corners to whole pixels, and since
    # solvePnP derives the pose from corner positions a one-pixel wobble becomes
    # degrees of orientation jitter. That jitter is what makes stability_score
    # dip below the acceptance gate and samples get rejected.
    # none | subpix | contour | apriltag
    corner_refinement: subpix
    corner_refinement_win_size: 5
    corner_refinement_max_iterations: 50
    corner_refinement_min_accuracy: 0.01

    # Temporal filtering across consecutive frames
    pose_filter_window: 5
    max_translation_jump_m: 0.05
    max_rotation_jump_deg: 15.0

    detection_timeout: 2.0            # s without a valid detection => 'stale'
