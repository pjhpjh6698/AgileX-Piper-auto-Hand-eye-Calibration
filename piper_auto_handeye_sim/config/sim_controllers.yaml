# ros2_control controllers for the Gazebo Piper (arm only, no gripper).
#
# Referenced from urdf/piper_handeye_gazebo.xacro. We ship our own instead of
# reusing piper_gazebo's because that one also declares gripper controllers for
# joint7/joint8, which this arm-only model does not have.
controller_manager:
  ros__parameters:
    update_rate: 500        # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

# Holds the fingers at their initial opening. The gripper is cosmetic here --
# the camera rides on link6 -- but without a controller claiming these joints
# they are free and the fingers sag open under gravity.
gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - joint7
      - joint8
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      joint7: {trajectory: 0.0, goal: 0.0}
      joint8: {trajectory: 0.0, goal: 0.0}

arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Constraints are switched OFF on purpose.
    #
    # We care that the arm STOPS somewhere known, not that it tracks precisely:
    # the pose actually reached is measured by FK from /joint_states, so tracking
    # error cannot bias the calibration. With tolerances enabled the controller
    # gave up mid-move ("Exceeded goal_time_tolerance: holding position...") and
    # parked the arm short of the target, which upstream saw as a move timeout.
    #
    # goal_time 0.0 disables the deadline; 0.0 joint tolerances disable the
    # position checks. The controller then keeps driving to the last point and
    # holds there.
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      joint1: {trajectory: 0.0, goal: 0.0}
      joint2: {trajectory: 0.0, goal: 0.0}
      joint3: {trajectory: 0.0, goal: 0.0}
      joint4: {trajectory: 0.0, goal: 0.0}
      joint5: {trajectory: 0.0, goal: 0.0}
      joint6: {trajectory: 0.0, goal: 0.0}
